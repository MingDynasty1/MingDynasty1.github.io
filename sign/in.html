    <div class="fixed inset-0 z-0 opacity-10 pointer-events-none">
        <div class="absolute top-0 left-0 w-full h-full bg-cover" style="background-image: url('https://p3-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/pc/super_tool/dfc94625bda34ad4bb5a98c64bf8e641~tplv-a9rns2rl98-image.image?lk3s=8e244e95&rcl=202602011947131EC4ED518A5E6032BB25&rrcfp=f06b921b&x-expires=1772538471&x-signature=OteYZR8cuHdqZzFVLS5%2BEG12SUI%3D')"></div>
    </div>

    <div class="relative z-10 w-full">
        <div class="w-full h-16 bg-[#A62424] shadow-lg flex items-center justify-center">
            <div class="w-3/4 h-full border-b-4 border-[#D4AF37] flex items-center justify-center">
                <h1 class="text-3xl md:text-4xl text-[#D4AF37] font-bold" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">
                    大明王朝 - 用户登录
                </h1>
            </div>
        </div>
    </div>

    <main class="relative z-20 container mx-auto px-4 py-8 md:py-16">
        <div class="max-w-2xl mx-auto bg-[#FFFFF0] rounded-lg shadow-xl overflow-hidden border-2 border-[#D4AF37]">
            <div class="relative bg-[#A62424] py-6 px-8 text-center">
                <h2 class="text-2xl md:text-3xl text-[#D4AF37] font-bold" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.5);" id="pageTitle">
                    登录账号
                </h2>
                <div class="absolute top-0 left-0 w-full h-2 bg-[#D4AF37]"></div>
                <div class="absolute bottom-0 left-0 w-full h-2 bg-[#D4AF37]"></div>
            </div>

            <div class="p-6 md:p-8 paper-texture">
                <!-- 授权卡片（由 JS 控制显示） -->
                <div id="authCard" class="auth-card" style="display: none;">
                    <div class="auth-header">
                        <i class="fa fa-shield auth-icon"></i>
                        <div>
                            <div class="auth-title">大明 OJ 正在请求授权</div>
                            <div style="color: #666; font-size: 0.95rem;">
                                client_id: <span id="displayClientId"></span>
                            </div>
                        </div>
                    </div>
                    <p style="font-size: 1.1rem; color: #2C2C2C; margin-bottom: 20px;">该应用将获得以下权限：</p>
                    <div class="permission-item">
                        <i class="fa fa-user-circle"></i>
                        <span class="perm-text">读取您的用户名</span>
                    </div>
                    <div class="permission-item">
                        <i class="fa fa-envelope"></i>
                        <span class="perm-text">读取您的邮箱地址</span>
                    </div>
                    <div class="auth-actions">
                        <button class="btn-authorize" id="authorizeBtn">授权并登录</button>
                        <button class="btn-cancel" id="cancelAuthBtn">取消</button>
                    </div>
                </div>

                <!-- 登录区域（未授权请求或未登录时显示） -->
                <div id="loginArea">
                    <!-- Figma -->
                    <button onclick="socialLogin('figma')" id="figmaLoginBtn" class="figma-btn">
                        <i class="fa fa-paint-brush"></i>
                        <span id="figmaBtnText">Continue with Figma</span>
                        <span id="figmaLoading" class="spinner" style="display:none;"></span>
                    </button>

                    <!-- GitHub -->
                    <button onclick="socialLogin('github')" id="githubLoginBtn" class="github-btn">
                        <i class="fa fa-github"></i>
                        <span id="githubBtnText">Continue with GitHub</span>
                        <span id="githubLoading" class="spinner" style="display:none;"></span>
                    </button>

                    <div class="divider">或使用邮箱登录</div>

                    <form id="loginForm" class="space-y-6">
                        <div class="space-y-2">
                            <label for="email" class="block text-[#2C2C2C] text-lg">
                                电子邮箱 <span class="text-[#A62424]">*</span>
                            </label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-[#2C2C2C]">
                                    <i class="fa fa-envelope"></i>
                                </span>
                                <input type="email" id="email" name="email"
                                    class="input-paper pl-10 pr-4 py-2 text-[#2C2C2C]"
                                    placeholder="请输入注册邮箱" required>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label for="password" class="block text-[#2C2C2C] text-lg">
                                密码 <span class="text-[#A62424]">*</span>
                            </label>

                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-[#2C2C2C]">
                                    <i class="fa fa-lock"></i>
                                </span>
                                <input type="password" id="password" name="password"
                                    class="input-paper pl-10 pr-4 py-2 text-[#2C2C2C]"
                                    placeholder="请输入密码" required>
                                <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 flex items-center pr-3 text-[#2C2C2C]">
                                    <i class="fa fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div id="loginError" class="hidden text-[#A62424] text-sm text-center"></div>

                        <div class="pt-4">
                            <button type="submit" id="emailLoginBtn" class="seal-button w-full py-3 px-6 text-lg font-bold">
                                登 录
                            </button>
                        </div>
                    </form>

                    <div class="text-right mt-2">
                        <a href="https://mingdynasty1.github.io/sign/re.html" class="text-sm text-[#A62424] hover:underline law-link">
                            🔑 忘记密码？
                        </a>
                    </div>
                    <div class="mt-6 text-center">
                        <p class="text-[#2C2C2C]">
                            还没有账号？ <a href="https://mingdynasty1.github.io/sign/up.html" class="law-link">立即注册</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="relative z-10 mt-16">
        <div class="w-full h-16 bg-[#A62424] shadow-lg flex items-center justify-center">
            <div class="w-3/4 h-full border-t-4 border-[#D4AF37] flex items-center justify-center">
                <p class="text-[#D4AF37] font-medium">
                    © 2013-2026 MingDynasty,Inc. 大明登录 | MingEmperor
                </p>
            </div>
        </div>
    </footer>

    <script>
        // ============================================================
        // 解析 URL 参数
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const clientId = urlParams.get('client_id');
        const ssid = urlParams.get('ssid');
        const redirectUri = urlParams.get('redirect_uri') || 'https://mingdynasty1.github.io/code/index.html';

        const isAuthRequest = !!clientId;

        // DOM
        const authCard = document.getElementById('authCard');
        const loginArea = document.getElementById('loginArea');
        const pageTitle = document.getElementById('pageTitle');
        const displayClientId = document.getElementById('displayClientId');

        // ============================================================
        // 根据登录状态 & 是否授权请求，决定 UI 展示
        // ============================================================
        async function refreshUI() {
            if (!isAuthRequest) {
                // 无授权请求：显示登录区域
                authCard.style.display = 'none';
                loginArea.style.display = 'block';
                pageTitle.textContent = '登录账号';
                return;
            }

            // 有授权请求
            displayClientId.textContent = clientId;
            pageTitle.textContent = '授权请求';

            const user = await getCurrentUser();
            if (user) {
                // 已登录 → 显示授权卡片，隐藏登录区
                authCard.style.display = 'block';
                loginArea.style.display = 'none';
            } else {
                // 未登录 → 显示登录区，隐藏授权卡片
                authCard.style.display = 'none';
                loginArea.style.display = 'block';
                pageTitle.textContent = '登录并授权';
            }
        }

        // ============================================================
        // 第三方登录
        // ============================================================
        async function socialLogin(provider) {
            let btn, btnText, loading;
            if (provider === 'github') {
                btn = document.getElementById('githubLoginBtn');
                btnText = document.getElementById('githubBtnText');
                loading = document.getElementById('githubLoading');
            } else if (provider === 'figma') {
                btn = document.getElementById('figmaLoginBtn');
                btnText = document.getElementById('figmaBtnText');
                loading = document.getElementById('figmaLoading');
            }

            const errorEl = document.getElementById('loginError');

            if (btn) { btn.style.opacity = '0.7'; btn.disabled = true; }
            if (btnText) btnText.textContent = `正在跳转到 ${provider === 'figma' ? 'Figma' : 'GitHub'}...`;
            if (loading) loading.style.display = 'inline-block';
            if (errorEl) errorEl.classList.add('hidden');

            try {
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: provider,
                    options: {
                        // 授权完成后回到当前登录页（携带 session），页面再处理跳转
                        redirectTo: window.location.href
                    }
                });
                if (error) throw error;
            } catch (error) {
                if (btn) { btn.style.opacity = '1'; btn.disabled = false; }
                if (btnText) btnText.textContent = provider === 'figma' ? 'Continue with Figma' : 'Continue with GitHub';
                if (loading) loading.style.display = 'none';
                if (errorEl) {
                    errorEl.textContent = '登录失败：' + error.message;
                    errorEl.classList.remove('hidden');
                }
                console.error('OAuth Error:', error);
            }
        }

        // ============================================================
        // 邮箱密码登录
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.querySelector('i').classList.toggle('fa-eye');
                    this.querySelector('i').classList.toggle('fa-eye-slash');
                });
            }

            const form = document.getElementById('loginForm');
            const errorEl = document.getElementById('loginError');
            const emailLoginBtn = document.getElementById('emailLoginBtn');

            form.addEventListener('submit', async function(event) {
                event.preventDefault();

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    errorEl.textContent = '请填写完整信息';
                    errorEl.classList.remove('hidden');
                    return;
                }

                errorEl.classList.add('hidden');
                emailLoginBtn.disabled = true;
                emailLoginBtn.textContent = '登录中...';

                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                emailLoginBtn.disabled = false;
                emailLoginBtn.textContent = '登 录';

                if (error) {
                    errorEl.textContent = '登录失败：' + error.message;
                    errorEl.classList.remove('hidden');
                    return;
                }

                // 登录成功 → 刷新 UI
                await refreshUI();
            });
        });

        // ============================================================
        // 授权 & 取消
        // ============================================================
        document.addEventListener('click', async function(e) {
            if (e.target && e.target.id === 'authorizeBtn') {
                const btn = e.target;
                btn.disabled = true;
                const originalText = btn.textContent;
                btn.textContent = '授权中...';

                try {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (!session) {
                        alert('会话已过期，请重新登录');
                        btn.disabled = false;
                        btn.textContent = originalText;
                        await refreshUI();
                        return;
                    }

                    // 把 access_token / refresh_token 带回 OJ
                    const sep = redirectUri.includes('?') ? '&' : '?';
                    const finalRedirect = redirectUri + sep
                        + 'access_token=' + encodeURIComponent(session.access_token)
                        + '&refresh_token=' + encodeURIComponent(session.refresh_token);

                    window.location.href = finalRedirect;
                } catch (err) {
                    console.error('authorize error:', err);
                    alert('授权失败：' + err.message);
                    btn.disabled = false;
                    btn.textContent = originalText;
                }
            }

            if (e.target && e.target.id === 'cancelAuthBtn') {
                window.location.href = redirectUri;
            }
        });

        // ============================================================
        // 初始化
        // ============================================================
        (async function init() {
            await refreshUI();

            // 监听登录状态变化（例如第三方登录回跳后）
            supabaseClient.auth.onAuthStateChange(async function() {
                await refreshUI();
            });
        })();
    </script>
</body>
</html>
