<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>地铁跑酷金陵版 · 明 · 珍宝 · 神州行</title>
  <link rel="icon" href="https://MingDynasty1.github.io/000000000000000000.png" type="image/png">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: "华文楷体", "STKaiti", "KaiTi", "楷体", serif;
      background-color: #1a1410;
      transition: background-color 0.5s;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #e8d5b0;
      text-shadow: 2px 2px 0 #3a2a1e, 4px 4px 8px rgba(0,0,0,0.7);
      z-index: 10;
      pointer-events: none;
      user-select: none;
      background: rgba(30, 20, 12, 0.5);
      padding: 10px 20px;
      border-radius: 40px;
      border-left: 4px solid #b89a6b;
      backdrop-filter: blur(2px);
      letter-spacing: 2px;
    }
    #info h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #info h1 small {
      font-size: 0.9rem;
      color: #c9b088;
      letter-spacing: 1px;
    }
    #score {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #f5e7c8;
      font-size: 2rem;
      background: rgba(20, 12, 6, 0.7);
      padding: 8px 24px;
      border-radius: 50px;
      border: 1px solid #b89a6b;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      z-index: 10;
      letter-spacing: 4px;
      text-shadow: 0 0 12px #c9a87c;
      font-weight: bold;
    }
    #best-score {
      position: absolute;
      top: 100px;
      right: 20px;
      color: #ffd966;
      font-size: 1.4rem;
      background: rgba(20, 12, 6, 0.7);
      padding: 5px 24px;
      border-radius: 50px;
      border: 1px solid #b89a6b;
      backdrop-filter: blur(4px);
      z-index: 10;
      letter-spacing: 2px;
      text-shadow: 0 0 12px #ffaa00;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #coin-display {
      position: absolute;
      top: 160px;
      right: 20px;
      color: #ffd966;
      font-size: 1.4rem;
      background: rgba(20, 12, 6, 0.7);
      padding: 5px 24px;
      border-radius: 50px;
      border: 1px solid #b89a6b;
      backdrop-filter: blur(4px);
      z-index: 10;
      letter-spacing: 2px;
      text-shadow: 0 0 12px #ffaa00;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #time-toggle {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(60, 40, 24, 0.8);
      backdrop-filter: blur(4px);
      border: 2px solid #b89a6b;
      color: #efddc0;
      font-size: 1.4rem;
      padding: 8px 24px;
      border-radius: 40px;
      cursor: pointer;
      z-index: 30;
      font-family: inherit;
      letter-spacing: 2px;
      transition: 0.2s;
      box-shadow: 0 4px 0 #2f1e12;
    }
    #time-toggle:active {
      transform: translateX(-50%) translateY(4px);
      box-shadow: 0 0 0 #2f1e12;
    }
    #controls {
      position: absolute;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 20px;
      z-index: 20;
      pointer-events: none;
      flex-wrap: wrap;
      padding: 0 10px;
    }
    .ctrl-btn {
      pointer-events: auto;
      background: rgba(60, 40, 24, 0.75);
      backdrop-filter: blur(4px);
      border: 2px solid #b89a6b;
      color: #efddc0;
      font-size: 2.2rem;
      padding: 12px 24px;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 8px 0 #2f1e12, 0 10px 30px rgba(0,0,0,0.6);
      transition: 0.08s linear;
      font-family: "华文楷体", "STKaiti", serif;
      min-width: 80px;
      letter-spacing: 4px;
      text-shadow: 0 0 8px #b28b5a;
      user-select: none;
      flex: 1 1 auto;
      max-width: 160px;
    }
    .ctrl-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #2f1e12;
    }
    .ctrl-btn.jump {
      background: rgba(80, 50, 20, 0.85);
      border-color: #d4a86a;
      color: #ffecce;
      flex: 2 1 auto;
      max-width: 200px;
    }

    /* ========== 地图容器（真地图形式） ========== */
    #map-container {
      position: absolute;
      top: 80px;
      left: 20px;
      width: 420px;
      height: 360px;
      background: rgba(20, 16, 12, 0.96);
      border: 2px solid #b89a6b;
      border-radius: 16px;
      backdrop-filter: blur(8px);
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0,0,0,0.85);
      padding: 10px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      transition: transform 0.35s ease, opacity 0.35s ease;
      user-select: none;
    }
    #map-container.collapsed {
      transform: translateX(calc(100% - 46px));
      opacity: 0.9;
    }
    #map-container.collapsed #map-grid {
      display: none;
    }
    #map-container.collapsed #map-title {
      writing-mode: vertical-rl;
      text-orientation: upright;
      height: 100%;
      border-bottom: none;
      padding: 8px 2px;
      justify-content: center;
    }
    #map-container.collapsed #map-title .title-text,
    #map-container.collapsed #map-title #map-toggle-hint {
      display: none;
    }
    #map-container.collapsed #map-title::after {
      content: '🗺️';
      font-size: 1.6rem;
      writing-mode: horizontal-tb;
    }

    #map-title {
      color: #e8d5b0;
      font-size: 0.9rem;
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #6a5238;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 26px;
      flex-shrink: 0;
    }
    #map-title span:last-child {
      font-size: 0.8rem;
      color: #b89a6b;
      flex-shrink: 0;
    }

    /* 关键：地图网格 8列 × 7行 */
    #map-grid {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(7, 1fr);
      gap: 3px;
      overflow: hidden;
    }

    .province-btn {
      background: rgba(90, 74, 58, 0.75);
      border: 1px solid #8a7a5a;
      border-radius: 5px;
      color: #e8d5b0;
      font-size: 0.62rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: 0.12s;
      font-family: inherit;
      line-height: 1.05;
      overflow: hidden;
      padding: 1px;
      word-break: break-all;
    }
    .province-btn:hover {
      background: rgba(184, 154, 107, 0.95);
      color: #1a1410;
      transform: scale(1.12);
      z-index: 5;
      box-shadow: 0 0 12px #b89a6b;
    }
    .province-btn.active {
      background: rgba(255, 200, 100, 0.95);
      color: #1a1410;
      border-color: #ffd966;
      box-shadow: 0 0 16px #ffaa00;
      font-weight: bold;
    }
    .province-btn.keyboard-selected {
      outline: 2px solid #ffd966;
      outline-offset: -1px;
      box-shadow: 0 0 20px #ffaa00;
    }

    /* ========== 暂停遮罩 ========== */
    #pause-mask {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 90; /* 低于地图面板(100)，高于游戏 */
      pointer-events: none;
    }
    #pause-mask.show {
      display: flex;
    }
    #pause-mask .pause-text {
      color: #ffd966;
      font-size: 2.2rem;
      text-shadow: 0 0 24px #ffaa00, 4px 4px 0 #3a2a1e;
      letter-spacing: 6px;
      text-align: center;
      animation: pulse 1.4s infinite;
    }
    #pause-mask .pause-text small {
      display: block;
      font-size: 1rem;
      color: #e8d5b0;
      margin-top: 8px;
      letter-spacing: 2px;
      animation: none;
    }

    /* ========== 倒计时遮罩 ========== */
    #countdown-mask {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 300;
      pointer-events: none;
    }
    #countdown-mask.show {
      display: flex;
    }
    #countdown-mask .countdown-text {
      color: #ffd966;
      font-size: 6rem;
      text-shadow: 0 0 40px #ffaa00, 6px 6px 0 #3a2a1e;
      letter-spacing: 4px;
      text-align: center;
      animation: countdownPulse 1s infinite;
      font-weight: bold;
    }
    #countdown-mask .countdown-text small {
      display: block;
      font-size: 1.2rem;
      color: #e8d5b0;
      margin-top: 12px;
      letter-spacing: 3px;
      animation: none;
      font-weight: normal;
    }
    @keyframes countdownPulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.9; }
      100% { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 700px) {
      .ctrl-btn { font-size: 1.6rem; padding: 8px 16px; min-width: 60px; letter-spacing: 2px; }
      #info h1 { font-size: 1.2rem; }
      #score { font-size: 1.4rem; padding: 4px 16px; }
      #coin-display { font-size: 1rem; padding: 3px 12px; top: 130px; }
      #best-score { font-size: 1rem; padding: 3px 12px; top: 80px; }
      #time-toggle { font-size: 1rem; padding: 6px 12px; }
      #map-container { width: 320px; height: 280px; top: 70px; left: 10px; }
      .province-btn { font-size: 0.5rem; }
      #pause-mask .pause-text { font-size: 1.6rem; }
      #countdown-mask .countdown-text { font-size: 4rem; }
    }
    #restart-tip {
      position: absolute;
      bottom: 140px;
      left: 0;
      right: 0;
      text-align: center;
      color: #dac29c;
      font-size: 1.2rem;
      text-shadow: 0 4px 12px #000;
      background: rgba(0,0,0,0.3);
      padding: 8px 28px;
      backdrop-filter: blur(2px);
      width: fit-content;
      margin: 0 auto;
      border-radius: 60px;
      border: 1px solid #6a5238;
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 15;
      opacity: 0.7;
    }
    #gameover-mask {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      pointer-events: none;
    }
    #gameover-mask.show {
      display: flex;
    }
    #gameover-mask .msg {
      color: #ffd966;
      font-size: 2.4rem;
      text-shadow: 0 0 24px #ffaa00, 4px 4px 0 #3a2a1e;
      letter-spacing: 4px;
      text-align: center;
      animation: pulse 1.2s infinite;
    }
    #gameover-mask .msg small {
      display: block;
      font-size: 1rem;
      color: #e8d5b0;
      margin-top: 12px;
      letter-spacing: 2px;
      animation: none;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
  </style>
</head>
<body>
  <div id="info">
    <h1>🏮 明·疾驰 <small id="stationLabel">金陵地铁 · 神州行</small></h1>
  </div>
  <div id="score">🏯 <span id="scoreValue">0</span></div>
  <div id="best-score">🏆 最佳 <span id="bestScoreValue">0</span></div>
  <div id="coin-display">🪙 <span id="coinValue">0</span></div>
  <div id="time-toggle">🌙 暮色</div>
  
  <!-- 地图区域 -->
  <div id="map-container">
    <div id="map-title">
      <span class="title-text">🗺️ 点击地图省份切换地铁站</span>
      <span id="map-toggle-hint">▼</span>
    </div>
    <div id="map-grid"></div>
  </div>

  <!-- 暂停遮罩 -->
  <div id="pause-mask">
    <div class="pause-text">
      ⏸ 游戏暂停
      <small>选择省份后继续 · 按 Esc 返回</small>
    </div>
  </div>

  <!-- 倒计时遮罩 -->
  <div id="countdown-mask">
    <div class="countdown-text" id="countdownText">
      3
      <small id="countdownSub">即将开始</small>
    </div>
  </div>

  <div id="controls">
    <div class="ctrl-btn" id="btnLeft">◀ 左</div>
    <div class="ctrl-btn jump" id="btnJump">⬆ 跃</div>
    <div class="ctrl-btn" id="btnRight">右 ▶</div>
  </div>
  <div id="restart-tip">⚡ 跳跃避障 · 拾取金币与滑板 · 触壁或障碍则重开</div>

  <div id="gameover-mask">
    <div class="msg">
      🏁 游戏结束
      <small>按 空格 重新开始 · 按 Enter 选择省份</small>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ========== 省份数据（含地图行列坐标） ==========
    const provinces = [
      { short: '黑', full: '黑龙江', capital: '哈尔滨', col: 7, row: 1 },
      { short: '新', full: '新疆', capital: '乌鲁木齐', col: 1, row: 2 },
      { short: '蒙', full: '内蒙古', capital: '呼和浩特', col: 5, row: 2 },
      { short: '吉', full: '吉林', capital: '长春', col: 7, row: 2 },
      { short: '辽', full: '辽宁', capital: '沈阳', col: 7, row: 3 },
      { short: '青', full: '青海', capital: '西宁', col: 2, row: 3 },
      { short: '甘', full: '甘肃', capital: '兰州', col: 3, row: 3 },
      { short: '宁', full: '宁夏', capital: '银川', col: 4, row: 3 },
      { short: '陕', full: '陕西', capital: '西安', col: 4, row: 4 },
      { short: '晋', full: '山西', capital: '太原', col: 5, row: 4 },
      { short: '冀', full: '河北', capital: '石家庄', col: 6, row: 4 },
      { short: '京', full: '北京', capital: '北京', col: 6, row: 3 },
      { short: '津', full: '天津', capital: '天津', col: 7, row: 4 },
      { short: '藏', full: '西藏', capital: '拉萨', col: 1, row: 4 },
      { short: '川', full: '四川', capital: '成都', col: 3, row: 4 },
      { short: '渝', full: '重庆', capital: '重庆', col: 4, row: 5 },
      { short: '豫', full: '河南', capital: '郑州', col: 5, row: 5 },
      { short: '鲁', full: '山东', capital: '济南', col: 6, row: 5 },
      { short: '滇', full: '云南', capital: '昆明', col: 2, row: 5 },
      { short: '黔', full: '贵州', capital: '贵阳', col: 3, row: 5 },
      { short: '湘', full: '湖南', capital: '长沙', col: 4, row: 6 },
      { short: '鄂', full: '湖北', capital: '武汉', col: 5, row: 6 },
      { short: '皖', full: '安徽', capital: '合肥', col: 6, row: 6 },
      { short: '苏', full: '江苏', capital: '南京', col: 7, row: 6 },
      { short: '沪', full: '上海', capital: '上海', col: 8, row: 6 },
      { short: '桂', full: '广西', capital: '南宁', col: 3, row: 6 },
      { short: '粤', full: '广东', capital: '广州', col: 4, row: 7 },
      { short: '赣', full: '江西', capital: '南昌', col: 5, row: 7 },
      { short: '闽', full: '福建', capital: '福州', col: 6, row: 7 },
      { short: '浙', full: '浙江', capital: '杭州', col: 7, row: 7 },
      { short: '台', full: '台湾', capital: '台北', col: 8, row: 7 },
      { short: '琼', full: '海南', capital: '海口', col: 4, row: 8 },
      { short: '港', full: '香港', capital: '香港', col: 5, row: 8 },
      { short: '澳', full: '澳门', capital: '澳门', col: 6, row: 8 }
    ];

    // ========== Cookie 最佳成绩 ==========
    function getBestScore() {
      const match = document.cookie.match(/(?:^|;\s*)Metro_best_score=([^;]*)/);
      return match ? parseInt(match[1]) || 0 : 0;
    }
    function setBestScore(score) {
      document.cookie = `Metro_best_score=${score}; path=/; max-age=31536000`;
    }
    let bestScore = getBestScore();
    const bestScoreSpan = document.getElementById('bestScoreValue');
    bestScoreSpan.textContent = bestScore;

    // ========== 初始化场景 ==========
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1410);
    scene.fog = new THREE.Fog(0x1a1410, 20, 55);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 4.2, 9);
    camera.lookAt(0, 0.5, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // ========== 光影 ==========
    const ambientLight = new THREE.AmbientLight(0x403020, 0.6);
    scene.add(ambientLight);
    const mainLight = new THREE.DirectionalLight(0xffdd99, 1.2);
    mainLight.position.set(5, 12, 8);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 1024;
    mainLight.shadow.mapSize.height = 1024;
    scene.add(mainLight);
    const fillLight = new THREE.DirectionalLight(0xffaa66, 0.5);
    fillLight.position.set(-4, 6, 10);
    scene.add(fillLight);
    const backLight = new THREE.DirectionalLight(0x446688, 0.3);
    backLight.position.set(0, 2, -10);
    scene.add(backLight);
    const lanternLight = new THREE.PointLight(0xff8844, 0.6, 15);
    lanternLight.position.set(0, 3, 5);
    scene.add(lanternLight);
    const moonLight = new THREE.DirectionalLight(0xaaccff, 0.0);
    moonLight.position.set(-5, 10, -5);
    scene.add(moonLight);

    let isNight = false;

    // ========== 轨道 ==========
    const groundWidth = 6;
    const segmentLength = 4;
    const totalSegments = 80;

    function createTrackSegment(zPos) {
      const group = new THREE.Group();
      const stoneMat = new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: 0.8, metalness: 0.1, emissive: new THREE.Color(0x1a120a), emissiveIntensity: 0.1 });
      const stone = new THREE.Mesh(new THREE.BoxGeometry(groundWidth, 0.3, segmentLength), stoneMat);
      stone.position.y = -0.15;
      stone.receiveShadow = true;
      stone.castShadow = true;
      group.add(stone);

      const railMat = new THREE.MeshStandardMaterial({ color: 0x7a6a5a, roughness: 0.7, metalness: 0.2, emissive: new THREE.Color(0x2a1a0a), emissiveIntensity: 0.05 });
      for (let side = -1; side <= 1; side+=2) {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, segmentLength), railMat);
        rail.position.set(side * 1.8, 0.1, 0);
        rail.receiveShadow = true;
        rail.castShadow = true;
        group.add(rail);
      }
      const decoMat = new THREE.MeshStandardMaterial({ color: 0x8a7a5a, emissive: new THREE.Color(0x3a2a1a), emissiveIntensity: 0.1 });
      for (let i = -1; i <= 1; i++) {
        const deco = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.3), decoMat);
        deco.position.set(i * 1.2, 0.2, 0);
        group.add(deco);
      }
      const pillarMat = new THREE.MeshStandardMaterial({ color: 0x8a7a5a, roughness: 0.9, emissive: new THREE.Color(0x2a1a0a), emissiveIntensity: 0.1 });
      for (let side = -1; side <= 1; side+=2) {
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.5, 8), pillarMat);
        pillar.position.set(side * 2.5, 0.25, 0);
        pillar.castShadow = true;
        pillar.receiveShadow = true;
        group.add(pillar);
      }
      group.position.z = zPos;
      return group;
    }

    const trackSegments = [];
    const trackGroup = new THREE.Group();
    const trackStartZ = -30;
    for (let i = 0; i < totalSegments; i++) {
      const z = trackStartZ + i * segmentLength;
      const seg = createTrackSegment(z);
      trackGroup.add(seg);
      trackSegments.push(seg);
    }
    scene.add(trackGroup);

    // ========== 宫灯 ==========
    const lanterns = [];
    function createLantern(x, z) {
      const group = new THREE.Group();
      const poleMat = new THREE.MeshStandardMaterial({ color: 0x4a2a1a, roughness: 0.9 });
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 1.2, 6), poleMat);

    // ========== 键盘导航 ==========
    function handleMapKeyboard(e) {
      if (!mapKeyboardMode) return false;
      // 按地理坐标排序索引，用于方向键导航
      const sorted = provinces.map((p, i) => ({...p, idx: i})).sort((a, b) => {
        if (a.row !== b.row) return a.row - b.row;
        return a.col - b.col;
      });
      const currentPos = sorted.findIndex(p => p.idx === keyboardIndex);
      
      if (e.key === 'ArrowRight') {
        // 找同行右侧最近的省份
        const cur = sorted[currentPos];
        let best = -1, bestDist = Infinity;
        for (let i = 0; i < sorted.length; i++) {
          if (sorted[i].row === cur.row && sorted[i].col > cur.col) {
            const d = sorted[i].col - cur.col;
            if (d < bestDist) { bestDist = d; best = i; }
          }
        }
        if (best >= 0) keyboardIndex = sorted[best].idx;
        e.preventDefault();
      } else if (e.key === 'ArrowLeft') {
        const cur = sorted[currentPos];
        let best = -1, bestDist = Infinity;
        for (let i = 0; i < sorted.length; i++) {
          if (sorted[i].row === cur.row && sorted[i].col < cur.col) {
            const d = cur.col - sorted[i].col;
            if (d < bestDist) { bestDist = d; best = i; }
          }
        }
        if (best >= 0) keyboardIndex = sorted[best].idx;
        e.preventDefault();
      } else if (e.key === 'ArrowDown') {
        const cur = sorted[currentPos];
        let best = -1, bestDist = Infinity;
        for (let i = 0; i < sorted.length; i++) {
          if (sorted[i].col === cur.col && sorted[i].row > cur.row) {
            const d = sorted[i].row - cur.row;
            if (d < bestDist) { bestDist = d; best = i; }
          }
        }
        if (best >= 0) keyboardIndex = sorted[best].idx;
        e.preventDefault();
      } else if (e.key === 'ArrowUp') {
        const cur = sorted[currentPos];
        let best = -1, bestDist = Infinity;
        for (let i = 0; i < sorted.length; i++) {
          if (sorted[i].col === cur.col && sorted[i].row < cur.row) {
            const d = cur.row - sorted[i].row;
            if (d < bestDist) { bestDist = d; best = i; }
          }
        }
        if (best >= 0) keyboardIndex = sorted[best].idx;
        e.preventDefault();
      } else if (e.key === 'Enter') {
        selectProvince(keyboardIndex);
        e.preventDefault();
        return true;
      } else if (e.key === 'Escape') {
        collapseMap();
        paused = false;
        pauseMask.classList.remove('show');
        e.preventDefault();
        return true;
      } else {
        return false;
      }
      // 更新高亮
      document.querySelectorAll('.province-btn').forEach((b, i) => {
        b.classList.toggle('keyboard-selected', i === keyboardIndex);
      });
      const btn = document.querySelectorAll('.province-btn')[keyboardIndex];
      if (btn) btn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      return true;
    }

        spawnObstacle(z);
      }
      
      for (let i = 0; i < 10; i++) {
        spawnCoinLine(12 + i * 7 + Math.random() * 3);
      }
      
      for (let i = 0; i < 3; i++) {
        spawnSkateboardItem(20 + i * 20 + Math.random() * 10);
      }
      
      camera.position.set(0, 4.2, 9);
      camera.lookAt(0, 0.5, 6);
      trainGroup.position.set(0, 0.2, -10);
      
      setTimeOfDay(isNight);
      updateTitle();
    }

    // ========== 碰撞检测 ==========
    function checkCollision() {
      const px = playerGroup.position.x;
      const pz = playerGroup.position.z;
      const py = playerGroup.position.y;
      if (py > 0.9) return false;
      for (let obs of obstacles) {
        const ox = obs.position.x;
        const oz = obs.position.z;
        const distX = Math.abs(px - ox);
        const distZ = Math.abs(pz - oz);
        if (distX < 0.6 && distZ < 0.6) return true;
      }
      return false;
    }

    // ========== 更新轨道和宫灯 ==========
    function updateTrackAndLanterns(playerZ) {
      const threshold = 20;
      for (let seg of trackSegments) {
        if (seg.position.z < playerZ - threshold) {
          seg.position.z += totalSegments * segmentLength;
        }
      }
      for (let l of lanterns) {
        if (l.position.z < playerZ - threshold) {
          l.position.z += totalSegments * segmentLength;
        }
      }
    }

    // ========== 更新金币和滑板 ==========
    function updateCollectibles(playerZ, clampedSpeed) {
      for (let i = coinMeshes.length - 1; i >= 0; i--) {
        const coin = coinMeshes[i];
        coin.position.z -= clampedSpeed;
        coin.rotation.z += 0.05;
        coin.rotation.y += 0.03;
        
        const dx = Math.abs(coin.position.x - playerGroup.position.x);
        const dz = Math.abs(coin.position.z - playerGroup.position.z);
        const dy = Math.abs(coin.position.y - playerGroup.position.y - 0.5);
        if (dx < 0.7 && dz < 0.7 && dy < 0.9) {
          coinsCollected++;
          coinValueSpan.textContent = coinsCollected;
          scene.remove(coin);
          coinMeshes.splice(i, 1);
          continue;
        }
        
        if (coin.position.z < playerZ - 20) {
          scene.remove(coin);
          coinMeshes.splice(i, 1);
        }
      }
      
      for (let i = skateboardMeshes.length - 1; i >= 0; i--) {
        const board = skateboardMeshes[i];
        board.position.z -= clampedSpeed;
        board.rotation.y += 0.02;
        
        const dx = Math.abs(board.position.x - playerGroup.position.x);
        const dz = Math.abs(board.position.z - playerGroup.position.z);
        if (dx < 0.9 && dz < 0.9 && playerGroup.position.y < 0.8) {
          hasSkateboard = true;
          skateboardTimer = skateboardDuration;
          scene.remove(board);
          skateboardMeshes.splice(i, 1);
          continue;
        }
        
        if (board.position.z < playerZ - 20) {
          scene.remove(board);
          skateboardMeshes.splice(i, 1);
        }
      }
      
      while (coinMeshes.length < 30) {
        const lastCoinZ = coinMeshes.length > 0 ? Math.max(...coinMeshes.map(c => c.position.z)) : playerZ;
        const newZ = lastCoinZ + 5 + Math.random() * 8;
        spawnCoinLine(newZ);
      }
      
      if (skateboardMeshes.length < 4 && Math.random() < 0.02) {
        const lastBoardZ = skateboardMeshes.length > 0 ? Math.max(...skateboardMeshes.map(s => s.position.z)) : playerZ;
        if (lastBoardZ < playerZ + 30) {
          spawnSkateboardItem(playerZ + 30 + Math.random() * 20);
        }
      }
    }

    // ========== 更新最佳成绩 ==========
    function updateBestScore() {
      const currentScore = Math.floor(score);
      if (currentScore > bestScore) {
        bestScore = currentScore;
        setBestScore(bestScore);
        bestScoreSpan.textContent = bestScore;
      }
    }

    // ========== 游戏结束处理 ==========
    function triggerGameOver() {
      gameOver = true;
      gameoverMask.classList.add('show');
    }

    // ========== 动画循环 ==========
    function animate() {
      requestAnimationFrame(animate);

      // 暂停或倒计时期间：只渲染不更新游戏逻辑
      if (!gameOver && !paused && !countdownActive) {
        let speedFactor = 1.0;
        if (score > speedThreshold) {
          const progress = Math.min((score - speedThreshold) / 800, 1.0);
          speedFactor = 1.0 + progress * 2.2;
        }
        const currentSpeed = baseSpeed * speedFactor;
        const clampedSpeed = Math.min(currentSpeed, maxSpeed);

        const diff = targetLane - currentLane;
        if (Math.abs(diff) > 0.01) {
          currentLane += Math.sign(diff) * 0.08;
        } else {
          currentLane = targetLane;
        }
        playerGroup.position.x = currentLane * 1.8;

        if (isJumping) {
          jumpVelocity += gravity;
          playerGroup.position.y += jumpVelocity;
          if (playerGroup.position.y <= 0.2) {
            playerGroup.position.y = 0.2;
            isJumping = false;
            jumpVelocity = 0;
          }
        }

        playerGroup.position.z += clampedSpeed;
        
        camera.position.x = playerGroup.position.x * 0.15;
        camera.position.z = playerGroup.position.z - 4.5;
        camera.lookAt(playerGroup.position.x * 0.1, 0.5, playerGroup.position.z + 5);

        score += 0.3 * (clampedSpeed / 0.2);
        scoreSpan.textContent = Math.floor(score);
        
        updateBestScore();

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.position.z -= clampedSpeed;
          if (obs.position.z < playerGroup.position.z - 20) {
            scene.remove(obs);
            obstacles.splice(i, 1);
          }
        }

        const lastObstacleZ = obstacles.length > 0 ? obstacles[obstacles.length-1].position.z : playerGroup.position.z;
        const maxSpawnZ = playerGroup.position.z + 25;
        while (obstacles.length < maxObstacles && lastObstacleZ < maxSpawnZ) {
          const newZ = lastObstacleZ + 3.0 + Math.random() * 3.0;
          spawnObstacle(newZ);
        }

        trainGroup.position.z += clampedSpeed * 0.85;
        if (trainGroup.position.z > playerGroup.position.z + 30) {
          trainGroup.position.z = playerGroup.position.z - 25;
        }

        updateCollectibles(playerGroup.position.z, clampedSpeed);

        if (hasSkateboard) {
          skateboardTimer--;
          playerGroup.position.y = Math.max(playerGroup.position.y, 0.3);
          if (skateboardTimer <= 0) {
            hasSkateboard = false;
            if (!isJumping) playerGroup.position.y = 0.2;
          }
        }

        updateTrackAndLanterns(playerGroup.position.z);

        if (checkCollision()) {
          if (hasSkateboard) {
            hasSkateboard = false;
            skateboardTimer = 0;
            playerGroup.position.y = 0.2;
            if (obstacles.length > 0) {
              let closest = obstacles[0];
              let minDist = Infinity;
              for (let obs of obstacles) {
                const d = Math.abs(obs.position.z - playerGroup.position.z);
                if (d < minDist) { minDist = d; closest = obs; }
              }
              scene.remove(closest);
              obstacles.splice(obstacles.indexOf(closest), 1);
            }
          } else {
            triggerGameOver();
          }
        }
        if (Math.abs(playerGroup.position.x) > 3.2) {
          if (hasSkateboard) {
            hasSkateboard = false;
            targetLane = 0;
            currentLane = 0;
            playerGroup.position.x = 0;
          } else {
            triggerGameOver();
          }
        }
      }

      const time = Date.now() * 0.002;
      lanternLight.intensity = (isNight ? 1.2 : 0.6) + Math.sin(time) * 0.15;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.addEventListener('contextmenu', e => e.preventDefault());
    console.log('🏮 神州行 · 地图版：选省暂停 · 3秒倒计时 · 空格重开 · Enter选省');
  </script>
</body>
